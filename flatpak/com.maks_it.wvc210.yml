id: com.maks_it.wvc210
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
command: maksit-wvc210
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-documents
  - --filesystem=xdg-pictures
cleanup:
  - /include
  - /lib/pkgconfig
  - "*.la"
  - "*.a"
build-options:
  prepend-path: /usr/lib/sdk/dotnet10/bin
  append-ld-library-path: /usr/lib/sdk/dotnet10/lib
  prepend-pkg-config-path: /usr/lib/sdk/dotnet10/lib/pkgconfig
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  arch:
    aarch64:
      env:
        RUNTIME: linux-arm64
    x86_64:
      env:
        RUNTIME: linux-x64
modules:
  - name: ffmpeg
    config-opts:
      - --enable-shared
      - --disable-static
      - --disable-doc
      - --disable-programs
      - --enable-gpl
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-4.4.5.tar.xz
        sha256: f9514e0d3515aee5a271283df71636e1d1ff7274b15853bcd84e144be416ab07

  - name: libvlc
    config-opts:
      - BUILDCC=gcc
      - --disable-lua
      - --disable-a52
      - --disable-qt
      - --disable-ncurses
      - --disable-udev
      - --disable-dbus
      - --disable-nls
      - --enable-vmem
    cleanup:
      - /bin
      - /share/applications
      - /share/metainfo
      - /share/icons
      - /share/kde4
      - /share/vlc
    sources:
      - type: archive
        url: https://download.videolan.org/videolan/vlc/3.0.23/vlc-3.0.23.tar.xz
        sha256: e891cae6aa3ccda69bf94173d5105cbc55c7a7d9b1d21b9b21666e69eff3e7e0
        x-checker-data:
          type: anitya
          project-id: 6504
          versions:
            ">=": "3"
            <: "4"
          url-template: https://download.videolan.org/videolan/vlc/$version/vlc-$version.tar.xz

  - name: wvc210
    buildsystem: simple
    build-commands:
      - dotnet publish src/MaksIT.Wvc210.UI/MaksIT.Wvc210.UI.csproj -c Release --source ./nuget-sources --source /usr/lib/sdk/dotnet10/nuget/packages --runtime $RUNTIME --self-contained true -o ${FLATPAK_DEST}/lib/wvc210
      - find ${FLATPAK_DEST}/lib/wvc210 -name '*.pdb' -delete
      - install -Dm755 data/maksit-wvc210 ${FLATPAK_DEST}/bin/maksit-wvc210
      - install -Dm644 data/com.maks_it.wvc210.desktop ${FLATPAK_DEST}/share/applications/com.maks_it.wvc210.desktop
      - install -Dm644 data/com.maks_it.wvc210.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.maks_it.wvc210.metainfo.xml
      - install -Dm644 src/MaksIT.Wvc210.UI/Assets/icon.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/com.maks_it.wvc210.png
      - install -Dm644 src/MaksIT.Wvc210.UI/Assets/icon.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/com.maks_it.wvc210.png
      - install -Dm644 src/MaksIT.Wvc210.UI/Assets/icon.png ${FLATPAK_DEST}/share/icons/hicolor/64x64/apps/com.maks_it.wvc210.png
      - install -Dm644 src/MaksIT.Wvc210.UI/Assets/icon.png ${FLATPAK_DEST}/share/icons/hicolor/48x48/apps/com.maks_it.wvc210.png
      - install -Dm644 src/MaksIT.Wvc210.UI/Assets/icon.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/com.maks_it.wvc210.svg
      - install -Dm644 LICENSE.md ${FLATPAK_DEST}/share/licenses/com.maks_it.wvc210/LICENSE.md
    sources:
      - type: git
        url: https://github.com/maks-it/maksit-wvc210.git
        tag: v1.2.1
        commit: 2d0d71bae84df15ca25eb385531f8efef6ad79e9
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - nuget-sources.json
